<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Dog Training Journey</title>
<meta name="theme-color" content="#0F3D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dog Training">
<meta name="mobile-web-app-capable" content="yes">
<link id="apple-icon" rel="apple-touch-icon" href="">
<link id="favicon" rel="icon" href="">
<link id="manifest-link" rel="manifest" href="">
<style>
:root{
  --teal-900:#0F3D3A;
  --teal-700:#1F6F68;
  --teal-600:#26857C;
  --teal-500:#2F8F86;
  --teal-100:#DCEAE7;
  --canvas:#F6F3EC;
  --paper:#FFFEFB;
  --sand:#EDE7D9;
  --sand-dark:#E1D9C4;
  --ink:#24261F;
  --ink-soft:#5B5D52;
  --ink-faint:#8B8C7F;
  --line:#DAD4C4;
  --clay:#A85C3B;
  --clay-soft:#EFE0D6;
  --moss:#5F7C4E;
  --moss-soft:#E1E9D8;
  --danger:#A83B3B;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --shadow-card:0 1px 2px rgba(36,38,31,0.06), 0 6px 18px rgba(36,38,31,0.06);
  --font-display:'Fraunces', Georgia, 'Iowan Old Style', serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--teal-900);}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--canvas);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--teal-100);}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  background:var(--canvas);
  position:relative;
  padding-bottom:calc(24px + var(--safe-bottom));
  box-shadow:0 0 60px rgba(0,0,0,0.15);
}
a{color:var(--teal-700);}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
.container{padding:0 20px;}
.stack{display:flex; flex-direction:column;}
.row{display:flex; align-items:center;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 20px; border-radius:999px; border:none;
  font-size:15px; font-weight:600; line-height:1;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--teal-700); color:#fff;}
.btn-primary:disabled{background:var(--ink-faint); opacity:.5; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--teal-700); border:1.5px solid var(--teal-700);}
.btn-plain{background:var(--sand); color:var(--ink);}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px; font-size:13px; border-radius:999px;}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600;
  letter-spacing:.02em; text-transform:uppercase;
}
.pill-active{background:var(--teal-100); color:var(--teal-900);}
.pill-complete{background:var(--moss-soft); color:var(--moss);}
.pill-locked{background:var(--sand-dark); color:var(--ink-faint);}
.divider{height:1px; background:var(--line); border:none; margin:0;}
.divider-strong{height:1px; background:var(--ink-faint); opacity:.35; border:none; margin:0;}
.divider-hero{height:2px; background:var(--teal-700); border:none; margin:0; width:40px; border-radius:2px;}
.card{
  background:var(--paper);
  border-radius:var(--radius-m);
  border:1px solid var(--line);
}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint); font-size:13px;}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:none;
  background:var(--sand); display:flex; align-items:center; justify-content:center;
  color:var(--ink);
}
.icon-btn svg{width:18px;height:18px;}
.top-nav{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(14px + var(--safe-top)) 16px 12px;
  background:linear-gradient(var(--canvas) 65%, transparent);
}
.top-nav .title{font-family:var(--font-display); font-size:19px; font-weight:600;}

/* ---------- Splash / Onboarding ---------- */
.onboard-screen{
  min-height:100vh; display:flex; flex-direction:column;
  padding:calc(28px + var(--safe-top)) 24px calc(28px + var(--safe-bottom));
}
.onboard-brand{display:flex; align-items:center; gap:10px;}
.onboard-brand .mark{width:34px;height:34px;}
.onboard-brand .name{font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--teal-900);}
.onboard-hero{flex:1; display:flex; flex-direction:column; justify-content:center; padding:24px 0;}
.onboard-hero h1{font-size:34px; line-height:1.12; color:var(--teal-900); margin:0 0 14px;}
.onboard-hero p{font-size:16px; color:var(--ink-soft); line-height:1.5; margin:0 0 6px; max-width:38ch;}
.onboard-actions{margin-top:0;}
.step-eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-600); font-weight:700; margin-bottom:10px;}
.step-q{font-size:24px; line-height:1.3; margin:0 0 8px; color:var(--teal-900);}
.step-sub{font-size:14.5px; color:var(--ink-soft); margin:0 0 26px; line-height:1.5;}
.choice-list{display:flex; flex-direction:column; gap:10px;}
.choice{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; border-radius:var(--radius-m);
  background:var(--paper); border:1.5px solid var(--line);
  font-size:15.5px; font-weight:600; text-align:left; width:100%;
}
.choice.selected{border-color:var(--teal-700); background:var(--teal-100); color:var(--teal-900);}
.choice .sub{font-weight:400; color:var(--ink-soft); font-size:13px; margin-top:2px;}
.field{margin-bottom:20px;}
.field label{display:block; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:8px;}
.field input[type=text], .field select{
  width:100%; padding:14px 16px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); background:var(--paper); font-size:16px; color:var(--ink);
}
.field input[type=text]:focus, .field select:focus, .choice:focus-visible, button:focus-visible, a:focus-visible{
  outline:2.5px solid var(--teal-500); outline-offset:2px;
}
.gender-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.gender-grid .choice{padding:12px 8px; justify-content:center; text-align:center; font-size:13.5px;}
.onboard-footer{margin-top:28px; display:flex; gap:10px;}
.progress-dots{display:flex; gap:6px; margin-bottom:20px;}
.progress-dots span{width:6px;height:6px;border-radius:50%;background:var(--sand-dark);}
.progress-dots span.on{background:var(--teal-600); width:18px; border-radius:3px;}
.loc-setup-item{padding:16px 0;}
.loc-setup-item .idx{font-family:var(--font-mono); font-size:11px; color:var(--teal-600); font-weight:700;}
.loc-setup-item .desc{font-size:13px; color:var(--ink-soft); margin:4px 0 10px; line-height:1.45;}
.loc-setup-item input{
  width:100%; padding:11px 14px; border-radius:var(--radius-s);
  border:1.5px solid var(--line); background:var(--paper); font-size:15px;
}

/* ---------- Journey (trail map) ---------- */
.journey-wrap{padding:4px 0 40px;}
.journey-hero{padding:6px 20px 22px;}
.journey-hero .eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--teal-600); font-weight:700;}
.journey-hero h1{font-size:26px; margin:8px 0 4px; color:var(--teal-900);}
.journey-hero p{color:var(--ink-soft); font-size:14.5px; margin:0; line-height:1.5;}
.trail{position:relative; padding:10px 0 10px 0;}
.trail-svg-col{position:absolute; left:34px; top:0; bottom:0; width:4px;}
.node-row{
  position:relative; display:flex; gap:16px; padding:0 20px 34px 20px; align-items:flex-start;
}
.node-row:last-child{padding-bottom:6px;}
.node-dot-wrap{position:relative; width:32px; display:flex; justify-content:center; flex-shrink:0; z-index:2;}
.node-dot{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line); background:var(--paper); color:var(--ink-faint);
  font-family:var(--font-mono); font-size:12px; font-weight:700;
}
.node-dot svg{width:15px;height:15px;}
.node-row.active .node-dot{background:var(--teal-700); border-color:var(--teal-700); color:#fff; box-shadow:0 0 0 5px var(--teal-100);}
.node-row.complete .node-dot{background:var(--moss); border-color:var(--moss); color:#fff;}
.node-card{
  flex:1; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:16px 16px; text-align:left; width:100%;
}
.node-row.locked .node-card{background:transparent; border-style:dashed; opacity:.7;}
.node-row.active .node-card{border-color:var(--teal-600); box-shadow:var(--shadow-card);}
.node-card .label{font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--teal-900); margin-bottom:2px;}
.node-row.locked .node-card .label{color:var(--ink-faint);}
.node-card .goal{font-size:13.5px; color:var(--ink-soft); line-height:1.45; margin-top:4px;}
.node-card .meta-row{display:flex; align-items:center; gap:8px; margin-top:10px;}
.trail-connector{
  position:absolute; left:15px; top:32px; bottom:-34px; width:2px;
  background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 11px);
}
.node-row.complete .trail-connector{background:var(--moss); opacity:.4;}
.node-row:last-child .trail-connector{display:none;}

.fab-settings{
  position:fixed; right:calc(16px + (100vw - 520px)/2); bottom:calc(20px + var(--safe-bottom));
  z-index:30; width:52px;height:52px;border-radius:50%;
  background:var(--teal-900); color:#fff; border:none; box-shadow:0 8px 24px rgba(15,61,58,.35);
  display:flex; align-items:center; justify-content:center;
}
@media (max-width:552px){ .fab-settings{ right:16px; } }
.fab-settings svg{width:22px;height:22px;}

/* ---------- Week Card / Detail screen ---------- */
.detail-header{
  position:sticky; top:0; z-index:15; background:var(--teal-900); color:#fff;
  padding:calc(14px + var(--safe-top)) 18px 18px;
  border-radius:0 0 20px 20px;
}
.detail-header .back-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.detail-header .back-btn, .detail-header .icon-btn-dark{
  width:36px;height:36px;border-radius:50%; background:rgba(255,255,255,.14); border:none;
  display:flex; align-items:center; justify-content:center; color:#fff;
}
.detail-header .back-btn svg, .detail-header .icon-btn-dark svg{width:17px;height:17px;}
.icon-btn-dark.flash-red{background:var(--danger) !important; color:#fff; transition:background .25s ease;}
.detail-header .phase-eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--teal-100); font-weight:700;}
.detail-header h1{font-size:24px; margin:6px 0 8px; color:#fff;}
.detail-header .overview{font-size:14px; color:var(--teal-100); line-height:1.55; opacity:.92; margin:0;}
.action-row{display:flex; gap:10px; margin-top:16px;}
.action-chip{
  flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:6px;
  background:rgba(255,255,255,.12); border:none; border-radius:var(--radius-s);
  padding:11px 12px; color:#fff; text-align:left;
}
.action-chip svg{width:16px;height:16px;}
.action-chip .lbl{font-size:12.5px; font-weight:700;}

.section-label{
  font-size:12px; text-transform:uppercase; letter-spacing:.07em; font-weight:700;
  color:var(--teal-700); padding:22px 20px 10px;
}
.carousel{display:flex; gap:12px; overflow-x:auto; padding:2px 20px 6px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;}
.carousel::-webkit-scrollbar{display:none;}
.ex-card{
  scroll-snap-align:start; flex:0 0 86%; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-m); padding:18px; box-shadow:var(--shadow-card);
}
.ex-card h3{margin:0 0 12px; font-size:18px; color:var(--teal-900);}
.ex-card .subhead{font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--teal-600); margin:14px 0 6px;}
.ex-card .subhead:first-of-type{margin-top:0;}
.ex-card ul{margin:0; padding-left:18px;}
.ex-card li{font-size:14px; line-height:1.55; margin-bottom:6px; color:var(--ink);}
.ex-card .why-text{font-size:14px; line-height:1.6; color:var(--ink-soft); margin:0;}
.carousel-dots{display:flex; justify-content:center; gap:5px; margin:10px 0 0;}
.carousel-dots span{width:5px;height:5px;border-radius:50%; background:var(--sand-dark);}
.carousel-dots span.on{background:var(--teal-600);}

.days-list{padding:6px 20px 10px;}
.day-row{border-bottom:1px solid var(--line);}
.day-row:last-child{border-bottom:none;}
.day-row-head{
  width:100%; background:none; border:none; display:flex; align-items:center; justify-content:space-between;
  padding:16px 2px; text-align:left; gap:10px;
}
.day-row-head .left{display:flex; align-items:center; gap:12px;}
.day-badge{
  width:34px;height:34px;border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:12.5px; flex-shrink:0;
  background:var(--sand); color:var(--ink-soft);
}
.day-row.complete .day-badge{background:var(--moss-soft); color:var(--moss);}
.day-row.active .day-badge{background:var(--teal-700); color:#fff;}
.day-row.locked .day-badge{color:var(--ink-faint);}
.day-title{font-weight:600; font-size:15px;}
.day-row.locked .day-title{color:var(--ink-faint);}
.day-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.chev{transition:transform .18s ease; color:var(--ink-faint); flex-shrink:0;}
.chev svg{width:16px;height:16px;}
.day-row.open .chev{transform:rotate(180deg);}
.day-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.day-row.open .day-body{max-height:2000px;}
.day-body-inner{padding:0 2px 18px;}
.session-block{margin-bottom:16px;}
.session-block:last-child{margin-bottom:0;}
.session-name{font-size:12px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--teal-700); margin-bottom:8px;}
.component-chain{display:flex; flex-direction:column; gap:0;}
.component{display:flex; align-items:flex-start; gap:10px; padding:8px 0;}
.component:not(:last-child){border-bottom:1px dashed var(--line);}
.component .dot{width:7px;height:7px;border-radius:50%; background:var(--teal-500); margin-top:6px; flex-shrink:0;}
.component .ctext{font-size:14px; line-height:1.4;}
.component .ctext b{font-weight:600;}
.component .cloc{font-size:12px; color:var(--ink-faint); margin-top:1px;}
.day-locked-note{
  display:flex; align-items:center; gap:8px; padding:12px 14px; margin-top:6px;
  background:var(--sand); border-radius:var(--radius-s); font-size:13px; color:var(--ink-soft);
}
.day-locked-note svg{width:15px;height:15px; flex-shrink:0;}
.complete-btn-wrap{margin-top:14px;}

/* ---------- Modals ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(15,17,14,.5); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal-sheet{
  width:100%; max-width:520px; background:var(--canvas); border-radius:22px 22px 0 0;
  max-height:88vh; overflow-y:auto; padding-bottom:calc(28px + var(--safe-bottom));
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes slideUp{from{transform:translateY(24px); opacity:.6} to{transform:translateY(0); opacity:1}}
.modal-grabber{width:38px;height:4px;background:var(--sand-dark); border-radius:3px; margin:12px auto 4px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:8px 20px 14px;}
.modal-head h2{font-size:19px; margin:0; color:var(--teal-900);}
.modal-close{width:32px;height:32px;border-radius:50%; background:var(--sand); border:none; display:flex; align-items:center; justify-content:center;}
.modal-close svg{width:14px;height:14px;}
.tabs{display:flex; gap:8px; padding:0 20px 14px;}
.tab-btn{padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-size:13.5px; font-weight:600; color:var(--ink-soft);}
.tab-btn.on{background:var(--teal-700); border-color:var(--teal-700); color:#fff;}
.modal-body{padding:0 20px 10px;}
.loc-item{padding:14px 0; border-bottom:1px solid var(--line);}
.loc-item:last-child{border-bottom:none;}
.loc-item .num{font-family:var(--font-mono); font-size:11px; color:var(--teal-600); font-weight:700;}
.loc-item .chosen{font-size:15.5px; font-weight:600; margin:3px 0 2px;}
.loc-item .desc{font-size:13px; color:var(--ink-soft); line-height:1.5;}
.rule-item{padding:14px 0; border-bottom:1px solid var(--line);}
.rule-item:last-child{border-bottom:none;}
.rule-item .rtitle{font-weight:600; font-size:14.5px; margin-bottom:4px; color:var(--teal-900);}
.rule-item p{margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
.glossary-item{padding:13px 0; border-bottom:1px solid var(--line);}
.glossary-item:last-child{border-bottom:none;}
.glossary-item dt{font-weight:700; font-size:14.5px; color:var(--teal-900); font-family:var(--font-display);}
.glossary-item dd{margin:4px 0 0; font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
.golden-banner{
  background:var(--teal-900); color:#fff; border-radius:var(--radius-m); padding:16px 18px; margin:0 0 16px;
}
.golden-banner .gt{font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--teal-100); margin-bottom:8px;}
.golden-banner li{font-size:13.5px; line-height:1.5; margin-bottom:6px; color:#fff;}
.golden-banner li:last-child{margin-bottom:0;}

/* ---------- Settings ---------- */
.settings-section{padding:18px 20px;}
.settings-section h3{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--teal-700); margin:0 0 12px;}
.setting-row{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:14px 0; border-bottom:1px solid var(--line);
}
.setting-row:last-child{border-bottom:none;}
.setting-row .lbl{font-size:14.5px; font-weight:600;}
.setting-row .desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}
.switch{width:46px;height:27px;border-radius:999px; background:var(--sand-dark); position:relative; border:none; flex-shrink:0;}
.switch.on{background:var(--teal-600);}
.switch::after{content:'';position:absolute; top:3px; left:3px; width:21px;height:21px;border-radius:50%; background:#fff; transition:transform .16s ease; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on::after{transform:translateX(19px);}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(28px + var(--safe-bottom)); transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:13.5px;
  z-index:80; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.empty-note{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script id="app-script">
/* ============================================================
   Dog Training Journey PWA
   Single-file build. Data + state + render, no framework.
   ============================================================ */

/* ---------------- Icons (inline SVG, stroke=currentColor) ---------------- */
const ICON = {

/* ---------------- Personalization ---------------- */
function personalize(str, s){
  if(!str) return str;
  const name = (s && s.dogName) ? s.dogName : 'your dog';
  const obj = s && s.dogGender==='female' ? 'her' : 'him';
  const poss = s && s.dogGender==='female' ? 'her' : 'his';
  return str.replace(/\{\{(dog_name|dog_object|dog_possessive)\}\}/g, (m,g)=>{
    if(g==='dog_name') return name;
    if(g==='dog_object') return obj;
    return poss;
  });
}
function P(str){ return personalize(str, STATE); }

const GLOSSARY = [
  {term:'Terminal marker', def:'The marker word/sound (e.g. "Yes") that means "that behaviour is complete and reward is coming to you" — used with Redirect Exercise, Recall, and Play. Always followed by movement and payment.'},
  {term:'Duration marker', def:'A separate marker (e.g. "Good") used for behaviours that must be held, like Place — signals "stay exactly where you are, reward is coming to you" rather than "come and get it."'},
  {term:'Punishment marker', def:'A firm but not shouted word (e.g. "Bad"/"Stop") used at the start of the Punishment Protocol to mark an unwanted behaviour the instant it happens.'},
  {term:'Re-engage cue', def:'A distinct sound or word (not the terminal marker) that tells {{dog_name}} it\u2019s now OK to come back onto the toy during Play, used after an "Out."'},
  {term:'Prong collar — fitting', def:'Should sit high on the neck, snug enough that light taps register without excessive slack, never used for hard yanks — taps only. The chain element sits on the side of the neck closest to the owner (e.g. if {{dog_name}} walks on your right, the chain sits on the left side of {{dog_possessive}} neck).'},
  {term:'Umbilical cord', def:'Keeping {{dog_name}} on a short lead attached to the owner\u2019s body/belt indoors, so {{dog_name}} is always within arm\u2019s reach and can\u2019t rehearse unwanted behaviours unsupervised.'},
  {term:'Back-tie', def:'Tethering {{dog_name}}\u2019s lead to a fixed point (e.g. furniture leg, hook) rather than to the owner, used during Place work or setups to prevent {{dog_name}} leaving position without the owner having to hold the lead.'},
  {term:'"Out"', def:'The cue meaning "release the toy and don\u2019t attempt to get it back" during Play, until the re-engage cue is given.'},
  {term:'"Break" / "OK"', def:'The release cue used in Loose Lead Walking to formally permit {{dog_name}} to take food from the floor or end a held position.'},
  {term:'"Heel"', def:'The cue meaning "walk directly beside me, head up, no pulling," held until formally released.'},
  {term:'Jackpot event', def:'A bigger-than-usual reward — 10\u201315 pieces of kibble fed one at a time, delivered while continuously moving backwards/away from {{dog_name}} — used to create unpredictability and mark an especially good response. Never thrown on the floor; chasing you should always be the best part of the game.'},

/* ---------------- Exercises (How / Why content) ---------------- */
const EX = {
  handFeeding:{ title:'Hand Feeding', how:[
    "No bowl feeding at all; no wet food — kibble only.",
    "Twice daily (morning meal, evening meal), fill a treat pouch with {{dog_possessive}} full meal and hand-feed it entirely.",
    "Location progresses across the week: Kitchen \u2192 Garden \u2192 Street just outside the front of the house.",
    "Immediately after each feed, {{dog_name}} goes straight back inside." ],
    why:"This is really just a mental switch — for {{dog_name}} and for you — that without you, {{dog_possessive}} food does not exist. It gets {{dog_name}} used to not being able to access food for free, which is the foundation everything else in the program builds on." },

  newtonsCradle:{ title:"Newton's Cradle", how:[
    'Pick a marker word/sound (e.g. "Yes", or a clicker).',
    "A single set is left \u2192 right \u2192 jackpot: throw a piece of kibble to your left, marking as you throw. When {{dog_name}} turns back from eating it, mark again and throw to the right. On the third turn, mark, then move backwards continuously away from {{dog_name}} while delivering 10\u201315 pieces of kibble one at a time — the jackpot event that completes the set. Repeat sets until the full meal is consumed.",
    "Critical timing: mark before any visible hand-to-pocket movement, and immediately when {{dog_possessive}} head turns back toward you — never before.",
    "Set rotation per feeding session (2 feeds/day \u00d7 7 days = 14 sessions, numbered continuously): 5 \u2192 10 \u2192 15 \u2192 5 \u2192 10 \u2192 15\u2026",
    "On the final set of each session, the jackpot event uses whatever food remains for that meal.",
    "{{dog_name}} must be on a flexi lead throughout." ],
    why:"Dogs have a hierarchy of communication — physical, sight, then audio, which is their least preferred. If {{dog_name}} sees your hand move to your pocket before the marker, {{dog_name}} learns hand-to-pocket (not the marker) predicts food. Marking first, every time, keeps the marker as the one true predictor of food arriving.\n\nMoving backwards during the jackpot event taps into {{dog_possessive}} prey drive — {{dog_name}} has to keep working for it. Jackpots create a \u201cgambler\u2019s\u201d effect: \u201cif I go back this time I might win big!\u201d — this keeps {{dog_name}} guessing about value and coming back for more. The jackpot is never thrown on the floor, because chasing you should always be the best part of the game.\n\nThe preceding Hand Feeding week gets {{dog_name}} used to not being able to get food for free at all; Newton\u2019s Cradle then builds the marker\u2019s meaning on top of that foundation." },

  redirectExercise:{ title:'Redirect Exercise', how:[
    "Use the prong collar on a 6ft lead and begin walking around.",
    "Every time {{dog_name}} appears to be distracted (sniffing the floor, a bush, or just not paying attention to you), use your marker and immediately start moving backwards, away from {{dog_name}}.",
    "If {{dog_name}} follows — great. Pay with 1 piece of kibble.",
    "If {{dog_name}} doesn\u2019t follow and stays focused on the distraction, use lead pressure to guide {{dog_object}} to you, then pay.",
    "If your first attempt to guide {{dog_object}} back doesn\u2019t work, use a little more pressure.",
    "Use taps, not pulls, on the lead. If you can\u2019t tap (only pull), your lead is too tight — move closer to {{dog_name}}.",
    "Repeat every time {{dog_name}} gets distracted. Every 5th successful repetition, jackpot with 10\u201315 pieces of kibble, fed one at a time.",
    "Aim for the 85% success rule — short, focused sessions." ],
    why:"In low-distraction, low-reward situations, this starts teaching {{dog_name}} that you are a better choice than anything else around {{dog_object}}. It also teaches {{dog_name}} that your marker is non-negotiable — the lead pressure is what happens if {{dog_name}} chooses to ignore it — and starts teaching {{dog_name}} how to \u201cturn off\u201d pressure from the collar, in an environment where {{dog_name}} is unlikely to blow through it." },

  play1:{ title:'Play', how:[
    "Put {{dog_name}} on {{dog_possessive}} prong collar and normal lead. Calmly take {{dog_object}} outside, let {{dog_object}} sniff and go to the toilet if needed.",
    "Hide the toy in your pocket or under your shirt. Hold the lead in one hand, present the toy with the other.",
    "Never put the toy in {{dog_possessive}} mouth. Show {{dog_object}} the toy, then immediately move it away — the game is that {{dog_name}} has to catch and \u201cwin\u201d it.",
    "If {{dog_name}} latches on, keep hold of the toy and test {{dog_possessive}} grip. If it\u2019s a good grip, don\u2019t just let go — make a noise as if you tried hard to keep it, and let the toy \u201cslip\u201d out of your hands.",
    "Once {{dog_name}} has won the toy, keep moving away from {{dog_object}}. Let {{dog_name}} parade for a few seconds, then re-engage by grabbing part of the toy while still moving away.",
    "If {{dog_name}} drops the toy, race {{dog_object}} back to it — you must win.",
    "Aim to win the game roughly 2 times out of every 10, and always finish on a win for you — never {{dog_name}}.",
    "As soon as play ends, move straight into Place decompression." ],
    why:"Dogs need an outlet to express themselves. Without clear windows for this, pressure builds up until it eventually boils over. Play creates a clear window for {{dog_name}} to express {{dog_possessive}} nature.\n\nYou\u2019ve probably noticed {{dog_name}} can go from 0 to 100 in a blink — but going from 100 back to 0 just as fast is arguably more impressive, which is why decompression happens immediately after play. Once tired out, {{dog_name}} is far more receptive to learning.\n\nWe always end the game on our win so {{dog_name}} feels a small sting of \u201closing\u201d — next time, {{dog_name}} is less likely to drop the toy, remembering that doing so ended the game." },

  looseLeadWalking1:{ title:'Loose Lead Walking (early introduction)', how:[
    "Use cones or lampposts as A/B reference points.",
    "Walk {{dog_name}} between them on {{dog_possessive}} prong collar and 6ft lead.",
    "If {{dog_name}} walks in front (nose in front of your toes), crosses behind you, or pulls toward something else, use fair lead pressure and turn 180\u00b0 back to where you came from — no terminal marker here." ],
    why:"Minimal food here keeps walking boring — which is what makes off-lead freedom rewarding by comparison. It also helps teach {{dog_name}} clearly what\u2019s expected while on lead: essentially, to do nothing besides walk next to you." },

  collarLeadDesensitisation:{ title:'Collar/Lead Desensitisation', how:[
    "Put {{dog_possessive}} collar and lead on indoors.",
    "Leave it on for 5 minutes, then remove it.",
    "If {{dog_name}} is already tethered on a collar/lead for something else at the time, use a separate collar/lead for this." ],
    why:"This reduces any anticipation of what comes after the collar goes on, so the collar stops being a signal that something (a walk, training, excitement) is about to happen." },

  place_w1:{ title:'Place', how:[
    'Walk {{dog_name}} onto the place bed. The moment all four paws are on it, say "place" and give a calm "good boy/girl."',
    "Build short duration on the bed with mild distraction.",
    "Add a back-tie if {{dog_name}} is making errors (getting up, leaving the bed).",
    "If using food to reward duration, don\u2019t deliver it too close after an error — this risks rewarding the recovery rather than the calm state." ],
    why:"This starts teaching {{dog_name}} impulse control very early on into what will be {{dog_possessive}} \u201cnew normal.\u201d This helps remove anticipation and hyper behaviour, while providing {{dog_object}} a safe, calm place outside of the crate." },

  recall23:{ title:'Recall (Phase 1 \u2192 Phase 2)', how:[
    "Phase 1: Switch {{dog_name}} onto {{dog_possessive}} flat collar. Use the prong collar with a flexi lead or long line. Let {{dog_name}} wander further than before. When ready, recall {{dog_name}}, using frequent, very gentle taps on the lead to guide {{dog_object}} back — don\u2019t stop until {{dog_name}} reaches your feet. Mark, move, pay (1 in 5 a jackpot).",
    "Phase 2 (from Day 10): Switch back to the prong collar. Instead of frequent gentle taps continuing until {{dog_name}} arrives, use slightly firmer lead taps (still frequent) that stop the instant {{dog_name}} turns, lifts {{dog_possessive}} head, and starts moving toward you." ],
    why:"Building a solid recall is essential for {{dog_possessive}} safety and the safety of others — it\u2019s the single most important skill for off-lead time. Phase 1\u2019s frequent gentle taps teach {{dog_name}} how to \u201cturn off\u201d the constant, mildly annoying pressure. Phase 2 starts teaching that acknowledging the recall quickly and early is what turns the pressure off, rather than the eventual return alone." },

  looseLeadPunishment:{ title:'Loose Lead Walking + Punishment Protocol Rehearsal', how:[
    "Loose Lead Walking: once reliable, introduce artificial distractions (dropped kibble). If {{dog_name}} puts {{dog_possessive}} head down for the kibble, use lead pressure and turn 180\u00b0 back, and keep re-presenting the food on the floor until {{dog_name}} learns to ignore it and walk past it. Once {{dog_name}} has a solid understanding of where {{dog_name}} should be, start using the command \u201cheel\u201d to begin the walk — held until formally released on a \u201cbreak\u201d/\u201cOK\u201d cue.",
    'Punishment Protocol (rehearsal target: something {{dog_name}} likes doing but shouldn\u2019t — counter surfing, bin diving, etc., never a reactive trigger): set up away from {{dog_name}}. Walk {{dog_object}} toward it. If {{dog_name}} goes for it: mark ("bad"/"stop") \u2192 2 firm lead pops \u2192 disappointed commentary while moving. Repeat this full sequence 3 times, then tether, deliver a final disappointed comment and a sigh, and turn your back. After 30+ seconds, reconcile fully, then re-present the trigger to test understanding.' ],
    why:"By adding synthetic distractions to loose lead walking, we further instil in {{dog_name}} what the expected behaviour is: head up, eyes front, walk next to you — the environment isn\u2019t {{dog_possessive}} to interact with unless you say so. The Punishment Protocol, rehearsed on something positively-associated rather than a real trigger, is the fairest way to teach {{dog_name}} that a wrong decision has consequences, without {{dog_name}} already being in a heightened emotional state." },

  playWithCues:{ title:'Play (with cues)', how:[
    'Introduce a start cue ("Shall we play?") and an end cue ("All finished").' ],
    why:"Adding these cues creates a clear window for {{dog_name}} — unless those words are heard, {{dog_name}} shouldn\u2019t be getting into high-arousal states." },

  place_w23:{ title:'Place', how:[
    "Continue daily duration work with mild distraction; increase the distraction level if {{dog_name}} is doing well.",
    "Consider a back-tie if you can\u2019t stay fully attentive.",
    "Introduce Formal Place Training as the evening variant — a calmer, more deliberate decompression session distinct from the quicker daytime touchpoints." ],
    why:"This helps teach {{dog_name}} that after play or other high-arousal states, the crate isn\u2019t the only place {{dog_name}} can relax and unwind. Dogs do most of their learning when asleep, so the calmer we can help {{dog_name}} be in the house, the quicker {{dog_name}} will learn whatever it is we\u2019re teaching {{dog_object}}." },

  superFocusPunishment:{ title:'Super Focus Game & Punishment Protocol Practice', how:[
    "Move Punishment Protocol rehearsal away from home (still a controlled setup, with somewhere to tether in sight of it).",
    "For Super Focus: stand somewhere with plenty of visible distractions, {{dog_name}} sat beside you. Every time {{dog_possessive}} focus shifts elsewhere — marker, move, pay.",
    "Expect these sessions to be short." ],
    why:"Practicing the Punishment Protocol away from home teaches {{dog_name}} that consequences apply everywhere, not just at home. Super Focus further strengthens the value of your marker by \u201cerasing\u201d the world around {{dog_name}}." },

  recallLooseLead:{ title:'Recall & Loose Lead Walking', how:[
    "Continue Phase 2 recall and Loose Lead Walking together at the day\u2019s location, layering in the location\u2019s natural distractions." ],
    why:"Combining these two skills under real environmental distraction is the bridge between isolated training exercises and the trigger work coming in Weeks 6&7. This gives an easy route into teaching {{dog_name}} that recall is still non-negotiable no matter where {{dog_name}} is or what the distraction is, without being so hard {{dog_name}} might fail." },

  phase3Recall:{ title:'Phase 3 Recall', how:[
    "Recall should now be fairly reliable. Don\u2019t set this phase up artificially — simply continue recalling {{dog_name}} during normal life.",
    "The first time {{dog_name}} doesn\u2019t respond immediately, use one very firm/harsh lead pop and guide {{dog_object}} back — one pop should be enough to get full attention.",
    "Mark and pay when {{dog_name}} arrives (even if a correction was needed) — jackpot the first few times." ],
    why:"Done correctly, this has a major impact on recall reliability. If the correction is significant enough, {{dog_name}} will want to avoid it in future — and that avoidance reinforces recall further, since coming back becomes the more comfortable choice." },

  place_w45:{ title:'Place', how:[
    "Formal Place Training becomes the primary decompression method, replacing the crate entirely.",
    "Start spacing out food delivery for duration rewards (10\u201315 minutes between rewards by this point) — build patience rather than rewarding on a fixed schedule.",
    "Correct with lead pressure if {{dog_name}} breaks position.",
    "Occasionally drop food on purpose as a deliberate \u201ctest\u201d of duration and impulse control." ],
    why:"Impulse control here is a huge game changer if we want {{dog_name}} to be calm. During Play, we\u2019re teaching {{dog_name}} that there are clear windows for expression; through everything else, we\u2019re teaching structure. Impulse control is one of the most important skills a dog can learn to be calm — imagine a dog that sees a squirrel and doesn\u2019t immediately bolt: that\u2019s impulse control." },

  playWithRules:{ title:'Play (with rules)', how:[
    "Start the game by building up frustration in {{dog_name}}: move backwards away from {{dog_name}} so {{dog_name}} starts chasing or jumping up at you. Gently push {{dog_object}} off and use phrases like \u201cget off,\u201d \u201ccome on\u201d to build frustration ahead of the game. Once {{dog_possessive}} energy is high, reveal the toy and begin.",
    'Teach "Out": with the toy in {{dog_possessive}} mouth, drop to {{dog_possessive}} level, hand on the toy, firm "OUT" + two firm lead pops. Wait for release — don\u2019t repeat the command, don\u2019t pull the toy out yourself.',
    "Add a re-engage cue (a sound or word) that must be heard before {{dog_name}} is allowed back on the toy.",
    "As play develops, you can rip the toy away just before {{dog_name}} latches on (max twice, then let {{dog_object}} win the third attempt)." ],
    why:"We build frustration now so the rules become even more important — following commands in high-arousal states is a much-needed skill. This also gives {{dog_name}} a clear window to jump at people — that annoying thing {{dog_name}} does to visitors now has a dedicated time and place, only when invited.\n\nAdding rules to Play teaches {{dog_name}} that boundaries still apply even in high-arousal states — a rehearsal for real triggers later, where {{dog_name}} will need to keep {{dog_possessive}} head even when aroused." },

  freedomWalk:{ title:'Freedom Walk with Long-Line', how:[
    "Switch from a flexi lead to a long training line, letting {{dog_name}} experience real freedom.",
    "Practice recall, falling back on the Phase 3 harsh correction if needed — by this point it should rarely be necessary." ],
    why:"{{dog_name}} will start to love this new freedom. With freedom comes more distractions and more chances to blow off recall — this is still all practice for real triggers, so keep training exactly as before." },

  playWeek67:{ title:'Play', how:[
    "If Play drive is high, add mild obedience into the game — e.g. waiting in a down while the toy is thrown, rather than reacting the instant it\u2019s released.",
    "You can also start using two leads now (green and red). The red lead is attached to the prong collar, the green lead to a flat collar. With a solid \u201cOUT,\u201d throw the toy and have {{dog_name}} remain in place. To further tap into {{dog_possessive}} drive, switch to the green lead, throw the toy, and release {{dog_name}} to get it — but hold {{dog_object}} back using the green lead. Don\u2019t fully prevent {{dog_name}} from getting the toy, but make {{dog_object}} pull you to it." ],

function genNewtonsCradleDays(){
  const counts=[5,10,15,5,10,15,5,10,15,5,10,15,5,10]; // 14 sessions, continuous rotation

        evening:[{type:'training',ex:['newtonsCradle'], setCount:counts[eIdx], location:eLoc}]
      } });
  }
  return days;
}

/* ============================================================
   DATE HELPERS (DST-safe: operate on local calendar components)
   ============================================================ */
function parseISODate(str){ const [y,m,d]=str.split('-').map(Number); return new Date(y, m-1, d); }
function fmtISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDaysISO(iso, n){ const d=parseISODate(iso); d.setDate(d.getDate()+n); return fmtISO(d); }
function todayISO(){ return fmtISO(new Date()); }
function fmtDisplay(iso){
  const d = parseISODate(iso);
  return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function nextMondays(count){
  const out=[];
  const d = new Date();
  d.setHours(0,0,0,0);
  const dow = d.getDay(); // 0=Sun..6=Sat
  let addToMonday = (8 - dow) % 7; // days until next Monday
  if(dow===1) addToMonday = 0; // today is Monday, include it
  const first = new Date(d); first.setDate(first.getDate()+addToMonday);
  for(let i=0;i<count;i++){
    const m = new Date(first); m.setDate(m.getDate() + i*7);
    out.push(fmtISO(m));
  }
  return out;
}

   whichever phases are active, used for global one-at-a-time
   gating and date computation.
   ============================================================ */
// Derivation per the confirmed skip logic in the scope doc
function activePhaseIdsExplicit(){
  const hand = STATE.handFeedingAlreadyDone, cradle = STATE.newtonsCradleAlreadyDone;
  const ids=[];
  if(hand===false){ ids.push('prePhaseA'); ids.push('prePhaseB'); }
  else if(hand===true && cradle===false){ ids.push('prePhaseB'); }
  // hand===true && cradle===true -> neither runs
  MAIN_PHASE_ORDER.forEach(id=>ids.push(id));
  return ids;
}
function buildAllDays(){
  const flat=[];
  activePhaseIdsExplicit().forEach(pid=>{
    const phase = PHASES[pid];
    phase.days.forEach(dayObj=>{
      flat.push({ phaseId:pid, dayObj });
    });
  });
  return flat;
}
function phaseStartIndex(phaseId, allDays){
  const idx = allDays.findIndex(d=>d.phaseId===phaseId);
  return idx;
}
function displayedLabel(phaseId){
  const hand = STATE.handFeedingAlreadyDone, cradle = STATE.newtonsCradleAlreadyDone;
  if(phaseId==='prePhaseA') return 'Week 1';
  if(phaseId==='prePhaseB') return hand===false ? 'Week 2' : 'Week 1';
  const handUsed = hand===false, cradleUsed = (hand===false || cradle===false);
  const shift = (handUsed?1:0) + (cradleUsed?1:0);
  const maps = {
    'week1': ['Week 1','Week 2','Week 3'],
    'weeks2-3': ['Weeks 2 & 3','Weeks 3 & 4','Weeks 4 & 5'],
    'weeks4-5': ['Weeks 4 & 5','Weeks 5 & 6','Weeks 6 & 7'],
    'weeks6-7': ['Weeks 6 & 7','Weeks 7 & 8','Weeks 8 & 9'],
  };
  return maps[phaseId][shift];
}
function phaseStatus(phaseId, allDays){
  const start = phaseStartIndex(phaseId, allDays);
  if(start===-1) return 'skipped';
  const count = PHASES[phaseId].days.length;
  const end = start+count; // exclusive
  if(STATE.completedCount >= end) return 'complete';
  if(STATE.completedCount >= start) return 'active';
  return 'locked';
}
function dayGlobalIndex(phaseId, dayNumber, allDays){
  return allDays.findIndex(d=>d.phaseId===phaseId && d.dayObj.day===dayNumber);
}
function dayStatus(globalIdx){
  if(globalIdx < STATE.completedCount) return 'complete';
  if(globalIdx === STATE.completedCount) return 'active';
  return 'locked';
}
function dayScheduledDate(globalIdx){
  if(!STATE.startDate) return null;
  return addDaysISO(STATE.startDate, globalIdx);
}
function canCompleteDay(globalIdx){
  if(dayStatus(globalIdx)!=='active') return false;
  const sched = dayScheduledDate(globalIdx);
  if(!sched) return true;
  return todayISO() >= sched;
}

function resolveLocationLabel(baseName){
  const loc = LOC_BY_NAME[baseName];
  if(!loc) return baseName;
  const assigned = STATE.locationAssignments[loc.id];
  return assigned ? assigned : baseName;
}
function sessionBlockHtml(sessionKey, comps, phase, dayObj, isPre){
  const label = sessionKey.charAt(0).toUpperCase()+sessionKey.slice(1);
  let compsHtml;
  if(isPre){
    const c = comps[0];
    const setCount = c.setCount ? ` \u2014 ${c.setCount} sets` : '';
    compsHtml = `<div class="component"><div class="dot"></div><div><div class="ctext"><b>${esc(EX[c.ex[0]].title)}</b>${esc(setCount)}</div><div class="cloc">${esc(c.location||dayObj.location)}</div></div></div>`;
  } else {
    compsHtml = comps.map(c=>{
      const info = componentLabel(c, phase);
      let loc = info.loc;
      if(loc==null){
        loc = resolveLocationLabel((sessionKey==='evening' && dayObj.eveningLocation) ? dayObj.eveningLocation : dayObj.location);
      } else if(!info.fixed){
        loc = resolveLocationLabel(loc);
      }
      return `<div class="component"><div class="dot"></div><div><div class="ctext"><b>${esc(info.title)}</b> \u2014 ${esc(info.sub)}</div><div class="cloc">${esc(loc)}</div></div></div>`;
    }).join('');
  }
  return `<div class="session-block"><div class="session-name">${esc(label)}</div><div class="component-chain">${compsHtml}</div></div>`;
}

function phaseLocationsUsed(phaseId){
  const phase = PHASES[phaseId];
  if(phase.kind==='pre'){
    if(phaseId==='prePhaseA'){
      const ranges = [];
      let cur=null;
      phase.days.forEach(d=>{
        if(cur && cur.name===d.location){ cur.to=d.day; }
        else { cur={name:d.location, from:d.day, to:d.day}; ranges.push(cur); }
      });
      return ranges.map(r=>({name:r.name, desc:`Days ${r.from}\u2013${r.to} of Hand Feeding.`}));
    }
    return NC_LOCATIONS.map(l=>({name:l.name, desc:`${l.sessions} feeding session${l.sessions===1?'':'s'} across the week.`}));
  }
  const names = new Set();
  phase.days.forEach(d=>{ names.add(d.location); if(d.eveningLocation) names.add(d.eveningLocation); });
  names.add('Garden'); // Play always here
  return [...names].map(name=>{
    const loc = LOC_BY_NAME[name];
    return { name, desc: loc ? loc.desc : '', locId: loc?loc.id:null };
  });
}

/* ============================================================
   BACKUP — export / restore full app state as a JSON file
   ============================================================ */
function exportBackup(){
  const {ui, ...persisted} = STATE;
  const payload = { app:'dog-training-journey-backup', version:1, exportedAt:new Date().toISOString(), state:persisted };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dog-training-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Backup downloaded.');
}
function restoreBackupFromFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const incoming = (parsed && parsed.state && typeof parsed.state === 'object') ? parsed.state : parsed;
      if(!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) throw new Error('not a backup object');
      const ui = STATE.ui;
      STATE = Object.assign(defaultState(), incoming, { ui });
      saveState();
      toast('Backup restored.');
      render();
    }catch(err){
      toast('That file doesn\u2019t look like a valid backup.');
    }
  };
  reader.onerror = ()=> toast('Couldn\u2019t read that file.');
  reader.readAsText(file);
}

/* ============================================================
   ROOT RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  let html;
  if(!STATE.onboarded){
    html = renderOnboarding();
  } else if(STATE.ui.view==='settings'){
    html = renderSettings();
  } else if(STATE.ui.view==='week' && STATE.ui.weekId){
    html = renderWeekDetail(STATE.ui.weekId);
  } else {
    html = renderJourney();
  }
  if(STATE.ui.modal==='location') html += renderLocationModal(STATE.ui.weekId);
  else if(STATE.ui.modal==='info') html += renderInfoModal(STATE.ui.weekId);
  else if(STATE.ui.modal==='golden') html += renderGoldenModal();
  else if(STATE.ui.modal==='restart-date') html += renderRestartDateModal();
  else if(STATE.ui.modal==='reset-confirm') html += renderResetConfirmModal();
  app.innerHTML = html;
  // restore carousel scroll position + wire scroll listener for dots
  if(STATE.ui.view==='week' && STATE.ui.weekId){
    const car = document.getElementById('ex-carousel');
    if(car){
      const phase = PHASES[STATE.ui.weekId];
      const savedIdx = STATE.ui.exCarouselIndex[STATE.ui.weekId] || 0;
      const cardW = car.firstElementChild ? car.firstElementChild.getBoundingClientRect().width + 12 : 0;
      if(savedIdx>0) car.scrollLeft = savedIdx * cardW;
      car.addEventListener('scroll', ()=>{
        clearTimeout(car.__t);
        car.__t = setTimeout(()=>{
          const w = car.firstElementChild ? car.firstElementChild.getBoundingClientRect().width + 12 : 1;
          const i = Math.round(car.scrollLeft / w);
          if(STATE.ui.exCarouselIndex[STATE.ui.weekId] !== i){
            STATE.ui.exCarouselIndex[STATE.ui.weekId] = i;
            const dotsEl = document.querySelector('.carousel-dots');
            if(dotsEl){
              [...dotsEl.children].forEach((el,idx)=> el.classList.toggle('on', idx===i));
            }
          }
        }, 80);
      }, {passive:true});
    }
  }
}

/* ============================================================
   DISPATCH — single delegated click handler
   ============================================================ */
function closeModalWithFlash(){
  const wasInfo = STATE.ui.modal==='info';
  STATE.ui.modal=null;
  render();
  if(wasInfo){
    const btn = document.querySelector('[data-action="open-info"]');
    if(btn){
      btn.classList.add('flash-red');
      setTimeout(()=>{ btn.classList.remove('flash-red'); }, 900);
    }
  }
}
document.addEventListener('click', function(e){
  const backdrop = e.target.closest('.modal-backdrop');
  if(backdrop && !e.target.closest('[data-stop]')){
    closeModalWithFlash(); return;
  }
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const draft = STATE.onboardingDraft;

  switch(action){
    case 'ob-start': goObStep('handfeeding'); STATE.ui._obHistory=['welcome']; render(); break;
    case 'ob-set': {
      const field = t.dataset.field; let val = t.dataset.value;
      if(val==='true') val=true; else if(val==='false') val=false;
      draft[field]=val; render(); break;
    }
    case 'ob-continue': obNext(t.dataset.from); break;
    case 'ob-back': obBack(); break;
    case 'ob-finish': {
      STATE.dogName = draft.dogName.trim();
      STATE.dogGender = draft.dogGender || 'male';
      STATE.startDate = draft.startDate;
      STATE.handFeedingAlreadyDone = !!draft.handFeedingAlreadyDone;
      STATE.newtonsCradleAlreadyDone = draft.handFeedingAlreadyDone ? !!draft.newtonsCradleAlreadyDone : false;
      STATE.locationAssignments = {};
      LOCATIONS.forEach(loc=>{ STATE.locationAssignments[loc.id] = (draft.locationAssignments && draft.locationAssignments[loc.id]) || loc.name; });
      STATE.completedCount = 0;
      STATE.onboarded = true;
      saveState();
      toast('Journey started \u2014 welcome, '+STATE.dogName+'!');
      render(); break;
    }
    case 'open-week': {
      if(t.disabled) break;
      const phaseId = t.dataset.phase;
      STATE.ui.view='week'; STATE.ui.weekId=phaseId; STATE.ui.modal=null;
      const allDays = buildAllDays();
      const startIdx = phaseStartIndex(phaseId, allDays);
      if(STATE.completedCount === startIdx){
        STATE.ui.modal='info'; STATE.ui.modalTab='rules';
      }
      render(); break;
    }
    case 'back-to-journey': STATE.ui.view='journey'; STATE.ui.weekId=null; STATE.ui.modal=null; render(); break;
    case 'open-settings': STATE.ui.view='settings'; STATE.ui.modal=null; render(); break;
    case 'open-location': STATE.ui.modal='location'; STATE.ui.weekId = t.dataset.phase || STATE.ui.weekId; render(); break;
    case 'open-info': STATE.ui.modal='info'; STATE.ui.modalTab='rules'; STATE.ui.weekId = t.dataset.phase || STATE.ui.weekId; render(); break;
    case 'open-golden': STATE.ui.modal='golden'; render(); break;
    case 'close-modal': closeModalWithFlash(); break;
    case 'modal-tab': STATE.ui.modalTab = t.dataset.tab; render(); break;
    case 'toggle-day': {
      const key = t.dataset.phase+':'+t.dataset.day;
      STATE.ui.openDays[key] = !STATE.ui.openDays[key];
      render(); break;
    }
    case 'complete-day': {
      const phaseId = t.dataset.phase, day = Number(t.dataset.day);
      const allDays = buildAllDays();
      const gIdx = dayGlobalIndex(phaseId, day, allDays);
      if(!canCompleteDay(gIdx)) break;
      STATE.completedCount = gIdx+1;
      saveState();
      toast('Day '+day+' marked complete.');
      const phase = PHASES[phaseId];
      const isLastDayOfPhase = phase.days[phase.days.length-1].day === day;
      STATE.ui.openDays[phaseId+':'+day] = false;
      if(isLastDayOfPhase){
        STATE.ui.view = 'journey';
        STATE.ui.weekId = null;
        STATE.ui.modal = null;
      } else {
        STATE.ui.openDays[phaseId+':'+(day+1)] = true;
      }
      render(); break;
    }
    case 'settings-set': {
      STATE[t.dataset.field] = t.dataset.value;
      saveState(); render(); break;
    }
    case 'export-backup': exportBackup(); break;
    case 'trigger-restore': {
      const input = document.getElementById('restore-file-input');
      if(input) input.click();
      break;
    }
    case 'open-restart-date': STATE.ui.modal='restart-date'; render(); break;
    case 'set-startdate': {
      STATE.startDate = t.dataset.value;
      saveState(); STATE.ui.modal=null; toast('Start date updated.'); render(); break;
    }
    case 'open-reset-confirm': STATE.ui.modal='reset-confirm'; render(); break;
    case 'confirm-reset-progress': {
      STATE.completedCount = 0;
      STATE.ui.openDays = {};
      STATE.ui.modal = null;
      saveState();
      toast('Progress reset.');
      render();
      break;
    }
    default: break;
  }
}, false);

document.addEventListener('input', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='ob-input'){
    STATE.onboardingDraft[el.dataset.field] = el.value;
  } else if(action==='ob-loc-input'){
    STATE.onboardingDraft.locationAssignments = STATE.onboardingDraft.locationAssignments || {};
    STATE.onboardingDraft.locationAssignments[el.dataset.locid] = el.value;
  } else if(action==='settings-input'){
    STATE[el.dataset.field] = el.value;
    saveState();
  } else if(action==='settings-loc-input'){
    STATE.locationAssignments[el.dataset.locid] = el.value;
    saveState();
  }
}, false);

document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'restore-file-input'){
    const file = e.target.files && e.target.files[0];
    if(file) restoreBackupFromFile(file);
    e.target.value = '';
  }
}, false);
